name: Load Test with K6

on: [push]

jobs:
  load-test:
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up K6
        uses: grafana/setup-k6-action@v1

      - name: Print environment variables
        run: |
          echo "AWS_REGION=${{ vars.AWS_REGION }}"
          echo "AWS_ACCESS_KEY_ID=${{ vars.AWS_ACCESS_KEY_ID }}"
          echo "AWS_SECRET_ACCESS_KEY=${{ vars.AWS_SECRET_ACCESS_KEY }}"
          echo "AWS_SESSION_TOKEN=${{ vars.AWS_SESSION_TOKEN }}"

      - name: Run K6 script
        run: k6 run ./k6-scripts/load-test.js
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_ACCESS_KEY_ID: ${{ vars.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ vars.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ vars.AWS_SESSION_TOKEN }}