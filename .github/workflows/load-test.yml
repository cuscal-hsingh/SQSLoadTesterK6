name: Load Test with K6

on: [push]

jobs:
  load-test:
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      actions: read
      contents: write
      id-token: write #needed for GitHub OIDC token for AWS

  steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up K6
      uses: grafana/setup-k6-action@v1

      # configure AWS login for SQS invokation
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      id: credentials
      with:
        audience: sts.amazonaws.com # using default role as we are using the official action.
        role-to-assume: ${{ vars.AWS_OIDC_ROLE_ARN }}
        aws-region: ${{ secrets.AWS_DEFAULT_REGION }}


    - name: Run K6 script
      uses: grafana/run-k6-action@v1
      with:
        path: ./k6-scripts/load-test.js
      env:
        AWS_REGION: 'ap-southeast-2'
